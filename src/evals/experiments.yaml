# Paper and rebuttal tables and figures, for `python -m evals.reproduce <name>`.
# store: RolloutSpec fields (rows may override); steps: steps averaged or plotted;
# metrics: keys of evals/reduce.py. VERIFY marks runs of unconfirmed provenance.

store_defs:
  km: &km {rollout: 100, nfe: 5, K: 16, ckpt: best}
  km_nfe2: &km_nfe2 {rollout: 50, nfe: 2, K: 16, ckpt: best}
  km_nfe10: &km_nfe10 {rollout: 50, nfe: 10, K: 16, ckpt: best}
  km_k64: &km_k64 {rollout: 20, nfe: 5, K: 64, ckpt: best}
  km_nfe_sweep: &km_nfe_sweep {rollout: 20, K: 16, ckpt: best, subset: {n: 64, seed: 0}}
  km_ablation: &km_ablation {rollout: 33, nfe: 5, K: 16, ckpt: last}
  synthetic: &synthetic {rollout: 50, nfe: 5, K: 16, ckpt: best}
  rc20: &rc20 {rollout: 20, nfe: 5, K: 16, ckpt: last, batch_size: 4}
  rc20_best: &rc20_best {rollout: 20, nfe: 5, K: 16, ckpt: best, batch_size: 4}
  rc2000: &rc2000 {rollout: 2000, nfe: 5, K: 16, ckpt: best, batch_size: 4}
  era5: &era5 {rollout: 40, nfe: 5, K: 16, ckpt: last, split: test, batch_size: 4}
  era5_best: &era5_best {rollout: 40, nfe: 5, K: 16, ckpt: best, split: test, batch_size: 4}

metric_sets:
  table1_synthetic: &table1_synthetic
    - {col: mse, label: "MSE ($10^{-3}$)", scale: 1.0e-3, prec: 3}
    - {col: crps, label: "CRPS ($10^{-2}$)", scale: 1.0e-2, prec: 3}
    - {col: rmsce, label: "RMSCE ($10^{-2}$)", scale: 1.0e-2, prec: 3}
    - {col: abs_log_ssr, label: "$|\\log(\\mathrm{SSR})|$", prec: 4}
  table1_real: &table1_real
    - {col: mse, label: "MSE ($10^{-3}$)", scale: 1.0e-3, prec: 2}
    - {col: crps, label: "CRPS ($10^{-2}$)", scale: 1.0e-2, prec: 3}
    - {col: rmsce, label: "RMSCE ($10^{-2}$)", scale: 1.0e-2, prec: 2}
    - {col: abs_log_ssr, label: "$|\\log(\\mathrm{SSR})|$", prec: 3}
  ablation: &ablation_metrics
    - {col: mse, label: "MSE", prec: 4}
    - {col: crps, label: "CRPS", prec: 4}
    - {col: rmsce, label: "RMSCE", prec: 4}
    - {col: abs_log_ssr, label: "$|\\log(\\mathrm{SSR})|$", prec: 4}
  rebuttal: &rebuttal_metrics
    - {col: mse, label: MSE, prec: 4}
    - {col: crps, label: CRPS, prec: 4}
    - {col: rmsce, label: RMSCE, prec: 4}
    - {col: ssr, label: SSR, prec: 4, better: one}
    - {col: sharpness, label: Spread, prec: 4}

row_sets:
  km4: &km4
    - {run: ddim_km_flow_42_2026-01-18T13-38-10, label: DDIM}
    - {run: flow_matching_km_flow_42_2026-01-18T13-37-59, label: FM}
    - {run: interpolant_km_flow_42_2026-01-18T13-38-36, label: SI}
    - {run: cone_km_flow_42_alldet_2026-01-22T11-43-08, label: TORNADO}
  rc:
    - &rc_ddim {run: ddim_real_combustion_42_rc_tornado_cond_job_469601, label: DDIM}
    - &rc_fm {run: flow_matching_real_combustion_42_rc_tornado_cond_job_469600, label: FM}
    - &rc_si {run: interpolant_real_combustion_42_rc_tornado_cond_job_469388, label: SI}
  era5:
    - &era5_ddim {run: ddim_era5_42_era5_ddim_job_532807, label: DDIM}
    - &era5_fm {run: flow_matching_era5_42_era5_fm_job_532808, label: FM}
    - &era5_si {run: interpolant_era5_42_era5_si_job_532809, label: SI}

experiments:

