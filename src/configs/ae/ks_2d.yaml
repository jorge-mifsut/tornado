model:
  model_name: AE
  lr: 1.0e-4
  encoder:
    in_channels: 1
    latent_channels: 4
    width_list: [64, 128, 256, 256]
    block_type: ["ResBlock", "ResBlock", "ResBlock", "ResBlock"]
    depth_list: [3, 3, 3, 3]
  decoder:
    in_channels: 1
    latent_channels: 4
    width_list: [64, 128, 256, 256]
    block_type: ["ResBlock", "ResBlock", "ResBlock", "ResBlock"]
    depth_list: [3, 3, 3, 3]
  kl_weight: 5.0e-06
  kl_warmup_epochs: 100
  lambda_iso: 1.0e-4
  lambda_curv: 1.0e-4
  lambda_vel: 0
  calib_K: 4
  calib_weight: 5.0e-1
  jac_weight: 1.0e-4

data:
  dataset:
    train_path: ${oc.env:SCRATCH}/datasets/ApeBench/ks_2d_train_1024.npy
    valid_path: ${oc.env:SCRATCH}/datasets/ApeBench/ks_2d_test_256.npy
    resolution_train: [51, 160, 160]
    resolution_valid: [201, 160, 160]
  normalizer:
    stat_path: ${oc.env:SCRATCH}/datasets/ApeBench/ks_2d_train_norm_stats.pkl
  pde: ks_2d
  num_workers: 8
  batch_size: 32
  ae: True

training:
  seed: 42
  devices: [0]
  accelerator: gpu
  strategy: auto
  check_val_every_n_epoch: 10
  log_every_n_steps: 10
  max_epochs: 5000
  log_dir: ${oc.env:SCRATCH}/stochastic_interpolants/logs/
  project: stochastic_interpolants
  wandb_mode: offline
  checkpoint: null
